name: ACP adapter pin updates

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: acp-adapter-pin-update
  cancel-in-progress: false

jobs:
  update-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent-runtime/plugins/package-lock.json

      - name: Update exact upstream package, tag, commit, and lock pins
        run: |
          set -euo pipefail
          node scripts/agent-runtime/update-acp-plugin-pins.mjs
          npm install \
            --prefix agent-runtime/plugins \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
          node scripts/agent-runtime/build-acp-plugin.mjs --check-config

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/acp-adapter-pins
          delete-branch: true
          commit-message: "build(agent-runtime): 공식 ACP 어댑터 핀을 갱신한다"
          title: "build(agent-runtime): 공식 ACP 어댑터 핀 갱신"
          body: |
            공식 Claude/Codex ACP 릴리스의 exact npm version, upstream tag/commit, lockfile을 함께 갱신합니다.

            병합 전 ACP adapter compatibility workflow와 candidate 초기화 검증이 필요합니다. 이 PR은 앱, CLI, Skill 버전을 올리지 않습니다.
          labels: dependencies,agent-runtime
