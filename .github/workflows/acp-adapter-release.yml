name: ACP adapter bundle release

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Adapter bundle to build
        required: true
        type: choice
        options: [claude, codex, all]
      channel:
        description: Publish a candidate, or promote its exact bundle to stable
        required: true
        type: choice
        options: [candidate, stable]
      confirm_sentry_healthy:
        description: Stable only — confirm candidate initialization telemetry is healthy
        required: false
        type: boolean
        default: false

concurrency:
  group: acp-adapter-release
  cancel-in-progress: false

jobs:
  build-sign-publish:
    if: github.actor == 'json-choi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    environment:
      # Reuse the protected signing environment so the updater key and its
      # password never need to be copied into a second GitHub environment.
      name: stable-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate promotion gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          SELECTED_PLUGIN: ${{ inputs.plugin }}
          SENTRY_HEALTHY: ${{ inputs.confirm_sentry_healthy }}
        run: |
          set -euo pipefail
          stable_pattern='^acp-bundle-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$'
          candidate_pattern='^acp-bundle-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*-candidate$'
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "ACP releases must run from an existing owner-created tag." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "candidate" && ! "$GITHUB_REF_NAME" =~ $candidate_pattern ]]; then
            echo "Candidate releases require acp-bundle-vYYYY.MM.DD.N-candidate." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" && ! "$GITHUB_REF_NAME" =~ $stable_pattern ]]; then
            echo "Stable releases require acp-bundle-vYYYY.MM.DD.N." >&2
            exit 1
          fi
          release_version="${GITHUB_REF_NAME#acp-bundle-v}"
          release_version="${release_version%-candidate}"
          IFS=. read -r release_year release_month release_day _ <<< "$release_version"
          if [[ "$(date -u -d "$release_year-$release_month-$release_day" +%Y.%m.%d 2>/dev/null || true)" != "$release_year.$release_month.$release_day" ]]; then
            echo "ACP release tags require a real UTC calendar date." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" && "$SELECTED_PLUGIN" != "all" ]]; then
            echo "A stable ACP catalog must publish Claude and Codex together." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" && "$SENTRY_HEALTHY" != "true" ]]; then
            echo "Stable promotion requires an explicit healthy Sentry initialization review." >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "stable" ]]; then
            candidate_tag="$GITHUB_REF_NAME-candidate"
            release_state="$(gh release view "$candidate_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv')"
            if [[ "$release_state" != $'false\ttrue' ]]; then
              echo "Stable promotion requires the published prerelease $candidate_tag." >&2
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/$candidate_tag:refs/tags/$candidate_tag"
            if [[ "$(git rev-parse "$candidate_tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "The candidate and stable tags must resolve to the same commit." >&2
              exit 1
            fi
          fi
          cargo test --locked -p release-updater-verify
          node scripts/agent-runtime/build-acp-plugin.mjs --check-config

      - name: Install isolated signature verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Materialize protected signing key
        shell: bash
        env:
          ACP_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ACP_SIGNING_PRIVATE_KEY"
          umask 077
          raw="$RUNNER_TEMP/acp-plugin.raw"
          decoded="$RUNNER_TEMP/acp-plugin.decoded"
          printf '%s' "$ACP_SIGNING_PRIVATE_KEY" > "$raw"
          if grep -Eq '^untrusted comment: (minisign|rsign) .*secret key' "$raw"; then
            mv "$raw" "$RUNNER_TEMP/acp-plugin.key"
          elif base64 --decode "$raw" > "$decoded" 2>/dev/null \
            && grep -Eq '^untrusted comment: (minisign|rsign) .*secret key' "$decoded"; then
            mv "$decoded" "$RUNNER_TEMP/acp-plugin.key"
            rm -f "$raw"
          else
            rm -f "$raw" "$decoded"
            echo "The protected signing key is neither a Minisign file nor Tauri base64 key." >&2
            exit 1
          fi

      - name: Build, sign, and verify selected bundles
        shell: bash
        env:
          MINISIGN_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SELECTED_PLUGIN: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          plugins=(claude codex)
          if [[ "$SELECTED_PLUGIN" != "all" ]]; then
            plugins=("$SELECTED_PLUGIN")
          fi
          released_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for plugin in "${plugins[@]}"; do
            output="$RUNNER_TEMP/acp-$plugin"
            node scripts/agent-runtime/build-acp-plugin.mjs \
              --plugin "$plugin" \
              --output "$output"
            node scripts/agent-runtime/sign-acp-plugin.mjs \
              --input "$output" \
              --secret-key "$RUNNER_TEMP/acp-plugin.key" \
              --release-tag "$GITHUB_REF_NAME" \
              --released-at "$released_at"

            minisign -Vm "$output/$plugin.tar.gz" \
              -x "$output/$plugin.tar.gz.minisig" \
              -p src-tauri/resources/agent-runtime/acp-plugin.pub
            minisign -Vm "$output/$plugin.manifest.canonical.json" \
              -x "$output/$plugin.manifest.canonical.json.minisig" \
              -p src-tauri/resources/agent-runtime/acp-plugin.pub
            mv "$output/build-metadata.json" "$output/$plugin.build-metadata.json"
          done

      - name: Verify stable artifacts match the candidate
        if: inputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_tag="$GITHUB_REF_NAME-candidate"
          for plugin in claude codex; do
            output="$RUNNER_TEMP/acp-$plugin"
            candidate="$RUNNER_TEMP/acp-candidate-$plugin"
            mkdir -p "$candidate"
            gh release download "$candidate_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$plugin.tar.gz" \
              --pattern "$plugin.build-metadata.json" \
              --dir "$candidate"
            cmp "$output/$plugin.tar.gz" "$candidate/$plugin.tar.gz"
            jq -S 'del(.artifact.path)' "$output/$plugin.build-metadata.json" \
              > "$RUNNER_TEMP/$plugin-current-metadata.json"
            jq -S 'del(.artifact.path)' "$candidate/$plugin.build-metadata.json" \
              > "$RUNNER_TEMP/$plugin-candidate-metadata.json"
            cmp "$RUNNER_TEMP/$plugin-current-metadata.json" \
              "$RUNNER_TEMP/$plugin-candidate-metadata.json"
          done

      - name: Publish verified bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PLUGIN: ${{ inputs.plugin }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          plugins=(claude codex)
          if [[ "$SELECTED_PLUGIN" != "all" ]]; then
            plugins=("$SELECTED_PLUGIN")
          fi
          release_tag="$GITHUB_REF_NAME"
          assets=()
          expected_names=()
          for plugin in "${plugins[@]}"; do
            output="$RUNNER_TEMP/acp-$plugin"
            for name in \
              "$plugin.tar.gz" \
              "$plugin.tar.gz.minisig" \
              "$plugin.manifest.json" \
              "$plugin.build-metadata.json"; do
              assets+=("$output/$name")
              expected_names+=("$name")
            done
          done

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release $release_tag is already published and immutable." >&2
              exit 1
            fi
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "DopeDB ACP adapter bundle $release_tag" \
              --notes "Signed Claude and Codex ACP adapter bundle. The app, CLI, and Skill versions are unchanged." \
              --latest=false
          fi

          gh release upload "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            "${assets[@]}" \
            --clobber

          expected="$(printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort)"
          actual="$(gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets | map(.name) | sort | .[]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Draft release asset closure does not match the selected adapters." >&2
            exit 1
          fi

          release_id="$(gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId \
            --jq .databaseId)"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release databaseId is missing or invalid." >&2
            exit 1
          fi
          prerelease=false
          if [[ "$CHANNEL" == "candidate" ]]; then prerelease=true; fi
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$prerelease" \
            -f make_latest=false \
            --silent

      - name: Erase signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/acp-plugin.key" "$RUNNER_TEMP/acp-plugin.raw" "$RUNNER_TEMP/acp-plugin.decoded"
