name: release

on:
  push:
    tags:
      - "app-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify owner, version, and main ancestry
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_ACTOR" != "json-choi" ]]; then
            echo "Only @json-choi may start a stable release." >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#app-v}"
          node scripts/release/verify-release-version.mjs "$tag_version"

          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Stable releases must point to a commit already merged into main." >&2
            exit 1
          fi

  publish-tauri:
    needs: verify-release
    permissions:
      contents: write
    timeout-minutes: 60
    environment:
      name: stable-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-15
            target: x86_64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: dopedb v__VERSION__
          releaseBody: |
            Download the macOS or Windows installer from the assets below.

            The Tauri updater uses `latest.json` from this release to detect and install signed updates.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

      - name: Upload stable direct-download asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          mkdir -p release-alias
          case "$TARGET" in
            x86_64-pc-windows-msvc)
              source_name="DopeDB_${GITHUB_REF_NAME#app-v}_x64-setup.exe"
              alias="DopeDB-windows-x64-setup.exe"
              ;;
            aarch64-apple-darwin)
              source_name="DopeDB_${GITHUB_REF_NAME#app-v}_aarch64.dmg"
              alias="DopeDB-macos-arm64.dmg"
              ;;
            x86_64-apple-darwin)
              source_name="DopeDB_${GITHUB_REF_NAME#app-v}_x64.dmg"
              alias="DopeDB-macos-x64.dmg"
              ;;
            *)
              echo "No stable alias configured for $TARGET"
              exit 0
              ;;
          esac

          gh release download "$tag" --pattern "$source_name" --dir release-alias
          matches=(release-alias/"$source_name")
          if [[ "${#matches[@]}" -ne 1 || ! -f "${matches[0]}" ]]; then
            echo "Expected exactly one current-version asset $source_name for $TARGET" >&2
            exit 1
          fi

          cp "${matches[0]}" "release-alias/$alias"
          gh release upload "$tag" "release-alias/$alias" --clobber

  finalize-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    # Full signed archives are downloaded twice (draft and anonymous public
    # paths) before this immutable release is considered complete.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install isolated Rust updater verifier
        uses: dtolnay/rust-toolchain@stable

      - name: Finalize public updater URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p release-finalize
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir release-finalize
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > release-finalize/assets.json

          node scripts/release/finalize-updater-json.mjs \
            --manifest release-finalize/latest.json \
            --assets release-finalize/assets.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME"

          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release-finalize/latest.json \
            --clobber

          # Clobbering latest.json changes its asset size and digest. GitHub's
          # draft asset metadata can lag the upload, so retry only that exact
          # stale-metadata condition; every closure/schema failure stops now.
          node scripts/release/wait-for-finalized-latest.mjs \
            --manifest release-finalize/latest.json \
            --assets release-finalize/assets.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME"

      - name: Verify complete draft updater closure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#app-v}"
          mkdir -p release-finalize/draft-assets
          for asset in \
            "DopeDB_${version}_aarch64.app.tar.gz" \
            "DopeDB_${version}_aarch64.app.tar.gz.sig" \
            "DopeDB_${version}_x64.app.tar.gz" \
            "DopeDB_${version}_x64.app.tar.gz.sig" \
            "DopeDB_${version}_x64-setup.exe" \
            "DopeDB_${version}_x64-setup.exe.sig"; do
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir release-finalize/draft-assets
          done

          node scripts/release/finalize-updater-json.mjs \
            --manifest release-finalize/latest.json \
            --assets release-finalize/assets.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --check

          cargo run --locked -p release-updater-verify -- \
            --manifest release-finalize/latest.json \
            --assets release-finalize/assets.json \
            --downloads release-finalize/draft-assets \
            --repository "$GITHUB_REPOSITORY" \
            --root "$GITHUB_WORKSPACE" \
            --tag "$GITHUB_REF_NAME"

      # GitHub immutable published releases can change only title and notes,
      # so public verification cannot precede the sole publish PATCH. All
      # draft closure, digest, and independent Minisign gates above run first;
      # the draft leaves the previous latest intact until this one REST
      # operation atomically publishes and selects the new latest release.
      - name: Publish the verified immutable release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `id` is GitHub's GraphQL node ID (for example RE_kw...), whereas
          # the REST PATCH endpoint requires the numeric `databaseId`.
          release_id="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release databaseId is missing or invalid." >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -f make_latest=true \
            --silent

      - name: Verify anonymous tag-specific public updater downloads
        run: |
          set -euo pipefail

          node scripts/release/download-public-updater-assets.mjs \
            --latest-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/latest.json" \
            --assets release-finalize/assets.json \
            --output release-finalize/public-assets \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME"

          cargo run --locked -p release-updater-verify -- \
            --manifest release-finalize/public-assets/latest.json \
            --assets release-finalize/assets.json \
            --downloads release-finalize/public-assets \
            --repository "$GITHUB_REPOSITORY" \
            --root "$GITHUB_WORKSPACE" \
            --tag "$GITHUB_REF_NAME"
