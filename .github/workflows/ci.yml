name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend_smoke:
    name: frontend-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend
        run: pnpm build

      - name: Test critical frontend paths
        run: pnpm test

  rust_smoke:
    name: rust-smoke
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Stage CLI sidecar
        run: bash scripts/build-sidecars.sh

      - name: Test critical Rust paths
        run: |
          cargo test --package dopedb --lib
          cargo test --package dopedb-protocol --test golden
          cargo test --package dopedb-cli --test terminal_session_e2e
          cargo test --package release-updater-verify

  provider_migration:
    name: provider-migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workspace-cloud/pnpm-lock.yaml

      - name: Install workspace cloud dependencies
        run: pnpm --dir workspace-cloud install --frozen-lockfile

      - name: Build workspace cloud without production secrets
        run: pnpm --dir workspace-cloud build

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Test Provider legacy migration and rollback
        run: bash scripts/test-provider-legacy-migration.sh

      - name: Test Provider import harness guard
        run: pnpm --dir workspace-cloud test:postgres-harness-guard

      - name: Test Provider import concurrency
        env:
          PROVIDER_IMPORT_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash scripts/test-provider-import-postgres.sh

  build:
    needs:
      - frontend_smoke
      - rust_smoke
      - provider_migration
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve the required build check
        env:
          FRONTEND_RESULT: ${{ needs.frontend_smoke.result }}
          RUST_RESULT: ${{ needs.rust_smoke.result }}
          PROVIDER_MIGRATION_RESULT: ${{ needs.provider_migration.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success
          test "$PROVIDER_MIGRATION_RESULT" = success

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify Windows UI palette paths
        run: node scripts/check-ui-palette.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          save-if: false

      - name: Stage Windows test sidecars
        shell: pwsh
        run: |
          cargo build --package dopedb-cli --bins
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/debug/dopedb-cli.exe src-tauri/binaries/dopedb-cli-x86_64-pc-windows-msvc.exe
          Copy-Item target/debug/dopedb-agent-bridge.exe src-tauri/binaries/dopedb-agent-bridge-x86_64-pc-windows-msvc.exe
          Copy-Item target/debug/dopedb-cli.exe src-tauri/binaries/cloud-sql-proxy-x86_64-pc-windows-msvc.exe

      - name: Test Windows ACP, Broker, and Provider boundaries
        run: |
          cargo test --package dopedb --lib broker::session::tests
          cargo test --package dopedb --lib features::providers::adapters::authority::tests
          cargo test --package dopedb-protocol --test golden
          cargo test --package dopedb-cli --test terminal_session_e2e
