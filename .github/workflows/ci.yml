name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend_smoke:
    name: frontend-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend
        run: pnpm build

      - name: Test critical frontend paths
        run: pnpm test

  rust_smoke:
    name: rust-smoke
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Stage CLI sidecar
        run: bash scripts/build-sidecars.sh

      - name: Test critical Rust paths
        run: |
          cargo test --package dopedb --lib
          cargo test --package dopedb-protocol --test golden
          cargo test --package dopedb-cli --test terminal_session_e2e

  build:
    needs:
      - frontend_smoke
      - rust_smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve the required build check
        env:
          FRONTEND_RESULT: ${{ needs.frontend_smoke.result }}
          RUST_RESULT: ${{ needs.rust_smoke.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          save-if: false

      - name: Test Windows ACP, Broker, and Provider boundaries
        run: |
          cargo test --package dopedb --lib broker::session::tests
          cargo test --package dopedb --lib features::providers::adapters::authority::tests
          cargo test --package dopedb-protocol --test golden
          cargo test --package dopedb-cli --test terminal_session_e2e
